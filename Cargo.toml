[package]
name = "mini-system-monitor-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.34.3", features = ["persistence"] }
egui = "0.34.3"
libc = "0.2.186"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sysinfo = "0.39.3"
uuid = { version = "1.23.2", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSScreen", "NSRunningApplication", "NSWorkspace", "libc"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }
