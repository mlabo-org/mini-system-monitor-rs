[package]
name = "mini-system-monitor-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.34.3", features = ["persistence"] }
egui = "0.34.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sysinfo = "0.39.3"
uuid = { version = "1.23.2", features = ["v4"] }
